name: CI

on:
  push:
    branches: [main, proj-comenius]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      hypothesis-profile: ${{ github.event_name == 'schedule' && 'extended' || 'ci' }}
