name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (fast, not slow)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env stays activated
    steps:
      - uses: actions/checkout@v4

      # Build the documented `caiman` conda environment. CaImAn is only
      # available via conda-forge, so the test job uses conda rather than a
      # plain pip install. The fast suite (-m "not slow") does not exercise
      # CaImAn itself, but the package declares it as a runtime dependency.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: linux_environment.yml
          activate-environment: caiman
          auto-activate-base: false

      - name: Install package (editable) with dev extras
        run: pip install -e ".[dev]"

      - name: Run fast test suite
        run: pytest tests/ -m "not slow" -p no:cacheprovider

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    # Advisory until a one-time `ruff format` / autofix pass lands; failures
    # here do not block merges yet. Flip `continue-on-error` to false once the
    # tree is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
