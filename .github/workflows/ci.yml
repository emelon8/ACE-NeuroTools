name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: Documentation (Read the Docs environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install ".[docs]"
      - run: python scripts/check_docs_links.py
      - run: bash scripts/sync_notebooks_for_docs.sh
      - run: python -m mkdocs build --strict
  test:
    name: Tests (locked environment)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: conda-lock.yml
          environment-name: aceneurotools
          cache-environment: true
          init-shell: bash
      - run: python -m pip install --no-deps -e .
      - run: MPLBACKEND=Agg python -m pytest tests/ -m "not slow"
  package:
    name: Installed wheel (import, CLI, GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check packaged browser scripts
        run: for file in src/aceneurotools/gui/*.js; do node --check "$file"; done
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/smoke_installed_package.py --wheel dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
