name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install build twine tomli
      - name: Verify tag and project version agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os, re, tomli; tag = os.environ["RELEASE_TAG"]; version = tomli.load(open("pyproject.toml", "rb"))["project"]["version"]; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), tag; assert tag == "v" + version, (tag, version)'
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aceneurotools
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
