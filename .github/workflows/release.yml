name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release integrity
    uses: ./.github/workflows/checks.yml

  version:
    name: Verify tag matches the checked package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag and project version agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os, re, tomllib; tag = os.environ["RELEASE_TAG"]; version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), tag; assert tag == "v" + version, (tag, version)'

  publish-pypi:
    # A tag alone must never publish while tracked lab CSV rights are unaudited.
    if: vars.PUBLIC_ARCHIVE_APPROVED_TAG == github.ref_name
    needs: [verify, version]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aceneurotools
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.distributions-artifact }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: vars.PUBLIC_ARCHIVE_APPROVED_TAG == github.ref_name
    needs: [verify, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.distributions-artifact }}
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
