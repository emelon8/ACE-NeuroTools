name: Workbench

on:
  push:
    branches: [main, proj-comenius, feat/aceneurotools-workbench]
    paths: ['gui/**', 'src/aceneurotools/evc/**', '.github/workflows/workbench.yml']
  pull_request:
    paths: ['gui/**', 'src/aceneurotools/evc/**', '.github/workflows/workbench.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: Python adapter (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated adapter
        run: |
          python -m pip install -r gui/server/requirements-dev.lock
          python -m pip install --no-deps -e . -e gui/server
      - name: Adapter regression tests
        run: python -m pytest gui/server/tests -q
      - name: Lint and format
        run: |
          ruff check gui/server gui/tests/serve.py gui/launch.py
          ruff format --check gui/server gui/tests/serve.py gui/launch.py

  browser:
    name: Chromium researcher workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test service
        run: |
          python -m venv gui/.venv
          gui/.venv/bin/python -m pip install -r gui/server/requirements-dev.lock
          gui/.venv/bin/python -m pip install --no-deps -e . -e gui/server
      - name: Build and check dependencies
        working-directory: gui
        run: |
          npm ci
          npm audit
          npm run build
          npm test
          git diff --exit-code -- public/THIRD_PARTY_NOTICES.txt
      - name: Browser workflows and accessibility
        working-directory: gui
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-evidence
          path: |
            gui/test-results
            gui/playwright-report
          retention-days: 14
