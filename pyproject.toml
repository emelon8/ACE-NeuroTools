[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"


[project]
name = "aceneurotools"
version = "0.1.0"
description = "Analysis of Calcium Imaging and Electrophysiology — integrated pipelines for calcium imaging, electrophysical, and multimodal alignment."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Reed Pennock" },
    { name = "Eric Melonakos" },
    { name = "Elijah Keldsen" },
]
keywords = [
    "neuroscience",
    "calcium-imaging",
    "electrophysiology",
    "miniscope",
    "cnmfe",
    "signal-processing",
    "data-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "pandas>=1.5",
    "opencv-python>=4.6",
    "tqdm>=4.64",
    "h5py>=3.7",
    "colorcet>=3.0",
    "neo>=0.12",
    "quantities>=0.14",
    "joblib>=1.2",
    "caiman>=1.11",
    "freesimplegui>=5.0",
    "Pillow>=9.0",
    "rich>=13",
]

[project.scripts]
ace-neuro = "aceneurotools.cli:main"

[project.optional-dependencies]
box = [
    "box-sdk-gen>=1.0",
]
# Optional accelerated coherogram path in multimodal.coherence_analysis
# (falls back to a pure-scipy implementation when these are absent).
coherence = [
    "xarray>=2023.1",
    "xrscipy>=2.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "pyrefly",
    "hypothesis>=6.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.0",
    "mkdocs-jupyter>=0.24.0",
    "python-markdown-math>=0.8",
]
all = [
    "aceneurotools[box,coherence]",
]

[project.urls]
Homepage = "https://github.com/emelon8/experiment_analysis"
Documentation = "https://aceneurotools.readthedocs.io/en/latest/"
Repository = "https://github.com/emelon8/experiment_analysis"
"Bug Tracker" = "https://github.com/emelon8/experiment_analysis/issues"


# Setuptools
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aceneurotools = ["py.typed", "shared/metadata_templates/*.csv"]


# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: full Miniscope CNMF-E pipeline on sample data (excluded from default CI)",
    "integration: heavier integration-level tests",
]

# Coverage (pytest-cov / coverage.py)
[tool.coverage.run]
branch = true
source = ["src/aceneurotools"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true


# Ruff (linter + formatter)
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name
]


# Pyrefly (type checking)
[tool.pyrefly]
python-version = "3.10"
ignore-missing-imports = [
    "caiman",
    "caiman.base.movies",
    "caiman.source_extraction.cnmf",
    "caiman.source_extraction.cnmf.params",
    "caiman.source_extraction.cnmf.estimates",
    "FreeSimpleGUI",
    "cv2",
    "scipy",
    "scipy.signal",
    "scipy.signal.windows",
    "box_sdk_gen",
    "joblib",
    "colorcet",
    "h5py",
]
