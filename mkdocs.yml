site_name: ACE NeuroTools
site_description: Analysis of Calcium Imaging and Electrophysiology — integrated pipelines for calcium imaging, ephys, and multimodal alignment.
site_url: https://ace-neurotools.readthedocs.io/en/latest/
repo_url: https://github.com/emelon8/ACE-NeuroTools
repo_name: GitHub
edit_uri: edit/main/docs/
site_author: "Reed Pennock, Luke Richards, Eric Melonakos"

theme:
  name: material
  # overrides/partials/logo.html draws the GUI's calcium-transient mark with
  # currentColor, so it inverts with the palette instead of using a fixed image.
  custom_dir: overrides
  favicon: assets/ace-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit

extra_css:
  - stylesheets/ace.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - mdx_math:
      enable_dollar_delimiter: True

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
  - mkdocs-jupyter:
      execute: false
      include_source: true

nav:
  - Home: index.md
  - User Guide:
      - Install and Open ACE: gui_installation.md
      - Experiment Workbench: gui.md
      - First-run Walkthrough: lab_walkthrough.md
  - Analysis Guides:
      - Command-line Getting Started: getting_started.md
      - Examples: examples.md
      - Calcium Imaging: guides/calcium_imaging.md
      - Electrophysiology: guides/ephys.md
      - Combined Recordings: guides/multimodal.md
      - Data Management: guides/data_management.md
      - Adapting to Your Recordings: guides/adapting_to_your_lab.md
  - Tutorials:
      - Miniscope Processing: notebooks/miniscope_pipeline_tutorial.ipynb
      - Ephys Processing: notebooks/ephys_pipeline_tutorial.ipynb
      - Multimodal Alignment: notebooks/multimodal_alignment_tutorial.ipynb
  - API Reference:
      - Overview: api/index.md
      - Pipelines: api/pipelines.md
      - Calcium Imaging Components: api/calcium_imaging.md
      - Ephys Components: api/ephys.md
      - Multimodal: api/multimodal.md
      - Shared Utils: api/shared.md
  - Development and Packaging:
      - Package installation: packaging.md
      - Release checklist: releasing.md
      - Backend checks: backend_testing.md
      - Build and publish docs: deployment.md
