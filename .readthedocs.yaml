# Read the Docs — https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    pre_build:
      # Mirror local/CI flow: copy notebooks into docs/ for mkdocs-jupyter
      - bash scripts/sync_notebooks_for_docs.sh

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # Docs dependencies only. Installing the package would pull caiman>=1.11,
    # which is not on PyPI; mkdocstrings reads the API from src/ instead.
    - requirements: docs/requirements.txt
